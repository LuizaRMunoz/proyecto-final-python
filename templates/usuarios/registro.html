{% extends 'base.html' %}

{% block title %}Registro de Usuario{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm mt-4">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Crear una Cuenta</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %} <!-- Etiqueta de seguridad obligatoria en Django -->
                    
                    {{ form.as_p }} <!-- Renderiza el formulario completo -->
                    
                    <button type="submit" class="btn btn-primary w-100 mt-3">Registrarse</button>
                </form>
            </div>
            <div class="card-footer text-center">
                <small>¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión aquí</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
